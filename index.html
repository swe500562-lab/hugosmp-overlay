<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 8px;
  background: transparent;
  font-family: Arial, Helvetica, sans-serif;
  color: #f4fff8;
}
.panel {
  width: 660px;
  padding: 22px 26px 18px;
  overflow: hidden;
  position: relative;
  text-align: center;
  border: 2px solid rgba(93,255,153,.85);
  border-radius: 22px;
  background: linear-gradient(145deg, rgba(7,19,16,.98), rgba(12,35,27,.97));
  box-shadow: 0 0 18px rgba(44,255,128,.22), inset 0 0 28px rgba(44,255,128,.07);
}
.panel:before {
  content: "";
  position: absolute;
  inset: 0 0 auto;
  height: 5px;
  background: linear-gradient(90deg, transparent, #50ff9a, #9dffca, #50ff9a, transparent);
}
.brand {
  margin: 0;
  color: #72ffad;
  font-size: 34px;
  font-weight: 1000;
  letter-spacing: 5px;
  text-shadow: 0 0 14px rgba(70,255,145,.55);
}
.subtitle {
  margin: 5px 0 17px;
  color: #a5c9b4;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 4px;
}
.spawner-card {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 23px;
  min-height: 138px;
  padding: 13px;
  border: 1px solid rgba(122,255,176,.2);
  border-radius: 16px;
  background: rgba(1,10,7,.48);
}
.spawner-icon {
  width: 112px;
  height: 112px;
  flex: 0 0 112px;
  position: relative;
  display: grid;
  place-items: center;
  border: 5px solid #647c70;
  border-radius: 13px;
  background:
    linear-gradient(90deg, transparent 42%, rgba(172,255,207,.7) 43% 48%, transparent 49% 72%, rgba(172,255,207,.7) 73% 78%, transparent 79%),
    linear-gradient(0deg, transparent 42%, rgba(172,255,207,.7) 43% 48%, transparent 49% 72%, rgba(172,255,207,.7) 73% 78%, transparent 79%),
    repeating-linear-gradient(45deg, #243d31 0 8px, #314d3e 8px 16px);
  box-shadow: inset 0 0 18px #000, 0 0 16px rgba(91,255,151,.18);
}
.spawner-icon:before {
  content: "";
  position: absolute;
  inset: 7px;
  border: 2px solid rgba(220,255,233,.55);
  border-radius: 5px;
}
.mob {
  z-index: 1;
  font-size: 48px;
  line-height: 1;
  filter: drop-shadow(0 2px 5px #000);
  animation: float 2s ease-in-out infinite;
}
.details { text-align: left; min-width: 0; }
.eyebrow {
  color: #7effae;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 3px;
}
.name {
  margin: 5px 0 0;
  font-size: 27px;
  font-weight: 1000;
  letter-spacing: 1px;
  text-shadow: 0 0 12px rgba(91,255,151,.2);
}
.status {
  margin-top: 7px;
  color: #9eb8a8;
  font-size: 12px;
  font-weight: 700;
}
.prices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 15px;
}
.price-box {
  padding: 12px 10px;
  border: 1px solid rgba(142,255,184,.2);
  border-radius: 13px;
  background: rgba(0,0,0,.3);
}
.label {
  color: #a8c3b2;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 2px;
}
.price {
  margin-top: 5px;
  font-size: 25px;
  font-weight: 1000;
}
.buy { color: #75ddff; }
.sell { color: #70ffa5; }
.footer {
  margin-top: 13px;
  color: #719080;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2px;
}
.dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-right: 6px;
  border-radius: 50%;
  background: #65ff9e;
  box-shadow: 0 0 8px #65ff9e;
}
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
</style>
</head>
<body>
<div class="panel">
  <h1 class="brand">HUGOSMP</h1>
  <div class="subtitle">SPAWNER MARKET</div>

  <div class="spawner-card">
    <div class="spawner-icon"><div class="mob" id="mob">☠️</div></div>
    <div class="details">
      <div class="eyebrow">AKTUELLER SPAWNER</div>
      <div class="name" id="name">SKELLY SPAWNER</div>
      <div class="status" id="status">Skelett · Verfügbar</div>
    </div>
  </div>

  <div class="prices">
    <div class="price-box">
      <div class="label">KAUFPREIS</div>
      <div class="price buy" id="buy">22.5m $</div>
    </div>
    <div class="price-box">
      <div class="label">VERKAUFSPREIS</div>
      <div class="price sell" id="sell">30m $</div>
    </div>
  </div>
  <div class="footer"><span class="dot"></span>WECHSELT AUTOMATISCH ALLE 10 SEKUNDEN</div>
</div>

<script>
const spawner = [
  {
    mob: "☠️",
    name: "SKELLY SPAWNER",
    status: "Skelett · Verfügbar",
    buy: "22.5m $",
    sell: "30m $"
  },
  {
    mob: "🟩",
    name: "CREEPER SPAWNER",
    status: "Creeper · Nicht auf Lager",
    buy: "18.5m $",
    sell: "NICHT AUF LAGER"
  }
];

let index = 0;
function wechseln() {
  const s = spawner[index];
  document.getElementById("mob").textContent = s.mob;
  document.getElementById("name").textContent = s.name;
  document.getElementById("status").textContent = s.status;
  document.getElementById("buy").textContent = s.buy;
  document.getElementById("sell").textContent = s.sell;
  index = (index + 1) % spawner.length;
}
setInterval(wechseln, 10000);
</script>
</body>
</html>
